<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>URP 설문 분석 대시보드</title>
<style>
:root{
  color-scheme:light;
  --bg:#f7f7f5;--surface:#ffffff;--text:#0b0b0b;--text-2:#52514e;--muted:#7d7c77;
  --border:rgba(0,0,0,.14);--accent:#2a78d6;--accent-ink:#ffffff;--accent-bg:#e3eefc;--danger:#b42f2f;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#131312;--surface:#1a1a19;--text:#ffffff;--text-2:#c3c2b7;--muted:#8f8e86;
    --border:rgba(255,255,255,.16);--accent:#3987e5;--accent-ink:#ffffff;--accent-bg:#1a3252;--danger:#e66767;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#131312;--surface:#1a1a19;--text:#ffffff;--text-2:#c3c2b7;--muted:#8f8e86;
  --border:rgba(255,255,255,.16);--accent:#3987e5;--accent-ink:#ffffff;--accent-bg:#1a3252;--danger:#e66767;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR",sans-serif;font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;display:grid;place-items:center;padding:16px}
.box{width:100%;max-width:360px;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:28px 24px}
h1{font-size:20px;font-weight:600;margin:0 0 4px;letter-spacing:-.01em;text-wrap:balance}
p{margin:0 0 20px;color:var(--text-2);font-size:13px}
label{display:block;font-size:12px;color:var(--text-2);margin-bottom:6px}
input[type=password]{width:100%;height:40px;border:1px solid var(--border);border-radius:8px;padding:0 12px;font:inherit;background:var(--bg);color:var(--text)}
input[type=password]:focus-visible,button:focus-visible,input[type=checkbox]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.row{display:flex;align-items:center;gap:6px;margin:12px 0 18px;font-size:13px;color:var(--text-2)}
.row label{margin:0;font-size:13px}
button{width:100%;height:40px;border:0;border-radius:8px;background:var(--accent);color:var(--accent-ink);font:inherit;font-weight:600;cursor:pointer}
button:disabled{opacity:.6;cursor:progress}
.err{color:var(--danger);font-size:13px;margin:10px 0 0;min-height:1.2em}
.note{margin:18px 0 0;font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<main class="box">
  <h1>URP 설문 분석 대시보드</h1>
  <p>팀 비밀번호를 입력하면 대시보드가 열려요.</p>
  <form id="f" autocomplete="off">
    <label for="pw">비밀번호</label>
    <input id="pw" type="password" required autofocus>
    <div class="row"><input id="remember" type="checkbox" checked><label for="remember">이 브라우저에서 기억하기</label></div>
    <button id="go" type="submit">열기</button>
    <div class="err" id="err" role="alert"></div>
  </form>
  <div class="note">설문 응답 데이터는 암호화되어 있어서, 비밀번호 없이는 이 주소로 내용을 볼 수 없어요.</div>
</main>

  const mk = await crypto.subtle.importKey('raw', bits.slice(32), {name: 'HMAC', hash: 'SHA-256'}, false, ['verify']);
  const iv = b64(P.iv), ct = b64(P.ct), signed = new Uint8Array(iv.length + ct.length);
  signed.set(iv); signed.set(ct, iv.length);
  if (!(await crypto.subtle.verify('HMAC', mk, b64(P.tag), signed))) return null;
  return new TextDecoder().decode(await crypto.subtle.decrypt({name: 'AES-CBC', iv}, ek, ct));
}
function show(html){ document.open(); document.write(html); document.close(); }
const f = document.getElementById('f'), pwEl = document.getElementById('pw'), btn = document.getElementById('go'), err = document.getElementById('err');
f.addEventListener('submit', async e => {
  e.preventDefault();
  err.textContent = ''; btn.disabled = true; btn.textContent = '여는 중…';
  try {
    const html = await unlock(pwEl.value);
    if (html == null){ err.textContent = '비밀번호가 맞지 않아요. 다시 확인해 주세요.'; return; }
    try { if (document.getElementById('remember').checked) localStorage.setItem(KEY, pwEl.value); else localStorage.removeItem(KEY); } catch (x) {}
    show(html);
  } catch (x) {
    err.textContent = '이 브라우저에서는 열 수 없어요. 최신 크롬·사파리·엣지로 열어 주세요.';
  } finally { btn.disabled = false; btn.textContent = '열기'; }
});
(async () => {
  let saved = null;
  try { saved = localStorage.getItem(KEY); } catch (x) {}
  if (!saved) return;
  try {
    const html = await unlock(saved);
    if (html != null) { show(html); return; }
  } catch (x) {}
  try { localStorage.removeItem(KEY); } catch (x) {}
})();
