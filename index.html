const KEY = 'urp-survey-dashboard-pw';
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function unlock(pw){
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveBits']);
  const bits = new Uint8Array(await crypto.subtle.deriveBits({name: 'PBKDF2', hash: 'SHA-256', salt: b64(P.salt), iterations: P.iter}, base, 512));
  const ek = await crypto.subtle.importKey('raw', bits.slice(0, 32), {name: 'AES-CBC'}, false, ['decrypt']);
  const mk = await crypto.subtle.importKey('raw', bits.slice(32), {name: 'HMAC', hash: 'SHA-256'}, false, ['verify']);
  const iv = b64(P.iv), ct = b64(P.ct), signed = new Uint8Array(iv.length + ct.length);
  signed.set(iv); signed.set(ct, iv.length);
  if (!(await crypto.subtle.verify('HMAC', mk, b64(P.tag), signed))) return null;
  return new TextDecoder().decode(await crypto.subtle.decrypt({name: 'AES-CBC', iv}, ek, ct));
}
function show(html){ document.open(); document.write(html); document.close(); }
const msg = document.getElementById('msg');
(async () => {
  let key = '';
  try { key = decodeURIComponent(location.hash.slice(1)); } catch (x) {}
  let saved = null;
  try { saved = localStorage.getItem(KEY); } catch (x) {}
  for (const k of [key, saved]) {
    if (!k) continue;
    try {
      const html = await unlock(k);
      if (html != null) { try { localStorage.setItem(KEY, k); } catch (x) {} show(html); return; }
    } catch (x) { msg.textContent = '이 브라우저에서는 열 수 없어요. 최신 크롬·사파리·엣지로 열어 주세요.'; return; }
  }
  if (saved) { try { localStorage.removeItem(KEY); } catch (x) {} }
  msg.textContent = key ? '링크가 올바르지 않아요. 팀에서 받은 링크를 그대로 열어 주세요.' : '팀에서 받은 전용 링크로 열어 주세요.';
})();
