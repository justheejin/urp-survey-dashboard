<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>URP 설문 분석 대시보드</title>
<style>
:root{
  color-scheme:light;
  --bg:#f7f7f5;--surface:#ffffff;--text:#0b0b0b;--text-2:#52514e;--muted:#7d7c77;
  --border:rgba(0,0,0,.14);--accent:#2a78d6;--accent-ink:#ffffff;--accent-bg:#e3eefc;--danger:#b42f2f;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#131312;--surface:#1a1a19;--text:#ffffff;--text-2:#c3c2b7;--muted:#8f8e86;
    --border:rgba(255,255,255,.16);--accent:#3987e5;--accent-ink:#ffffff;--accent-bg:#1a3252;--danger:#e66767;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#131312;--surface:#1a1a19;--text:#ffffff;--text-2:#c3c2b7;--muted:#8f8e86;
  --border:rgba(255,255,255,.16);--accent:#3987e5;--accent-ink:#ffffff;--accent-bg:#1a3252;--danger:#e66767;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR",sans-serif;font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;display:grid;place-items:center;padding:16px}
.box{width:100%;max-width:360px;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:28px 24px}
h1{font-size:20px;font-weight:600;margin:0 0 4px;letter-spacing:-.01em;text-wrap:balance}
p{margin:0 0 20px;color:var(--text-2);font-size:13px}
.note{margin:18px 0 0;font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<main class="box">
  <h1>URP 설문 분석 대시보드</h1>
  <p id="msg">여는 중…</p>
  <div class="note">팀에서 공유한 전용 링크로 열어야 내용을 볼 수 있어요. 링크를 받지 못했다면 팀에 요청해 주세요.</div>
</main>
<script>
const P = __PAYLOAD__;
const KEY = 'urp-survey-dashboard-pw';
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function unlock(pw){
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveBits']);
  const bits = new Uint8Array(await crypto.subtle.deriveBits({name: 'PBKDF2', hash: 'SHA-256', salt: b64(P.salt), iterations: P.iter}, base, 512));
  const ek = await crypto.subtle.importKey('raw', bits.slice(0, 32), {name: 'AES-CBC'}, false, ['decrypt']);
  const mk = await crypto.subtle.importKey('raw', bits.slice(32), {name: 'HMAC', hash: 'SHA-256'}, false, ['verify']);
  const iv = b64(P.iv), ct = b64(P.ct), signed = new Uint8Array(iv.length + ct.length);
  signed.set(iv); signed.set(ct, iv.length);
  if (!(await crypto.subtle.verify('HMAC', mk, b64(P.tag), signed))) return null;
  return new TextDecoder().decode(await crypto.subtle.decrypt({name: 'AES-CBC', iv}, ek, ct));
}
function show(html){ document.open(); document.write(html); document.close(); }
const msg = document.getElementById('msg');
(async () => {
  let key = '';
  try { key = decodeURIComponent(location.hash.slice(1)); } catch (x) {}
  let saved = null;
  try { saved = localStorage.getItem(KEY); } catch (x) {}
  for (const k of [key, saved]) {
    if (!k) continue;
    try {
      const html = await unlock(k);
      if (html != null) { try { localStorage.setItem(KEY, k); } catch (x) {} show(html); return; }
    } catch (x) { msg.textContent = '이 브라우저에서는 열 수 없어요. 최신 크롬·사파리·엣지로 열어 주세요.'; return; }
  }
  if (saved) { try { localStorage.removeItem(KEY); } catch (x) {} }
  msg.textContent = key ? '링크가 올바르지 않아요. 팀에서 받은 링크를 그대로 열어 주세요.' : '팀에서 받은 전용 링크로 열어 주세요.';
})();
</script>
</body>
</html>
